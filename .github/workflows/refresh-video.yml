name: refresh-video-urls
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-video-urls
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh signed video URLs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          VIDEO_PAGES: ${{ secrets.VIDEO_PAGES }}
        run: python3 scripts/refresh_videos.py
      - name: Update screen lock hash
        env:
          SITE_PASSCODE: ${{ secrets.SITE_PASSCODE }}
        run: python3 scripts/make_gate.py
      - name: Commit if changed
        run: |
          git config user.name "video-refresh"
          git config user.email "video-refresh@users.noreply.github.com"
          git add data/video-urls.json data/gate.json
          git diff --cached --quiet || (git commit -m "refresh video urls" && git push)
