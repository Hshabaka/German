<!doctype html>
<html lang="en" dir="ltr" class="locked">
<head>
<meta charset="utf-8">
<script src="../../js/base.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1 files</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/lessons.css">
</head>
<body>
<main class="lx-wrap" style="max-width:720px;margin:0 auto;padding:16px">
<h1>A1 files (PDFs and exercises)</h1>
<p>All lesson files from 1 to 28, as in the original course. The names are the original file names.</p>
<section style="margin:14px 0;padding:10px 14px;border:1px solid #cbd5e1;border-radius:10px"><h3 style="margin:0 0 6px">Course introduction (YouTube video links, they open outside the page)</h3>
<p><a href="https://www.youtube.com/watch?v=iXOOk8C3qKI" target="_blank" rel="noopener">Start here: how to study the course</a></p>
<p><a href="https://www.youtube.com/watch?v=EttOHd-Xc1E" target="_blank" rel="noopener">Course introduction</a></p></section>
<div id="app">Loading…</div>
</main>
<script>
(fetch('data/registry.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(g=>{var L=g.levels.a1.lessons,p={};L.forEach(x=>{p[String(x.n)]=x.pdfs||[]});return [p,{level:'A1',lessons:L.map(x=>({n:x.n,title:x.title,page_id:x.page_id}))}]}).catch(()=>Promise.all([fetch('data/a1-pdfs.json').then(r=>r.json()),fetch('data/a1-index.json').then(r=>r.json())]))).then(function(a){
  var m=a[0],L=a[1].lessons,app=document.getElementById('app');app.textContent='';
  L.forEach(function(l){
    var fs=m[String(l.n)]||[];
    var d=document.createElement('section');d.style.cssText='margin:14px 0;padding:10px 14px;border:1px solid #cbd5e1;border-radius:10px';
    var h=document.createElement('h3');h.style.margin='0 0 6px';
    var ha=document.createElement('a');ha.href='a1/s'+(l.n<10?'0':'')+l.n+'/';ha.textContent=l.title;h.appendChild(ha);d.appendChild(h);
    if(!fs.length){var p=document.createElement('p');p.textContent='No files.';d.appendChild(p);}
    fs.forEach(function(f){var p=document.createElement('p');p.style.margin='6px 0';var x=document.createElement('a');x.href=f.file;x.target='_blank';x.rel='noopener';x.style.cssText='display:inline-block;min-height:44px;line-height:44px';x.textContent='📄 '+f.label;p.appendChild(x);d.appendChild(p);});
    app.appendChild(d);
  });
}).catch(function(){document.getElementById('app').textContent='Could not load the list.';});
</script>
<script src="js/gate.js"></script><script src="js/sitenav.js"></script>
</body>
</html>
